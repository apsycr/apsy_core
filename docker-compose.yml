name: apsy_dev

services:

  mariadb:

    image: mariadb:10.11

    container_name: apsy_mariadb

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Costa_Rica

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/apsy.cnf:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        - CMD-SHELL
        - 'mariadb-admin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    stop_grace_period: 30s

  apsy_core:

    build:
      context: ./apsy_core

    container_name: apsy_core

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: America/Costa_Rica
      APSY_ENV: dev

    ports:
      - "9000:9000"

    volumes:
      - ./apsy_core:/app
      - ${APSY_DATA}/config:/config
      - ${APSY_DATA}/logs:/logs
      - ${APSY_DATA}/uploads:/uploads
      - ${APSY_DATA}/releases:/releases

    depends_on:
      mariadb:
        condition: service_healthy

  nginx:

    image: nginx:latest

    restart: unless-stopped

    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      #- ./nginx/conf.d:/etc/nginx/conf.d
      - ${APSY_DATA}/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - ${APSY_DATA}/apsy_fe:/var/www/apsy_fe

      - ${APSY_DATA}/config/ssl:/ssl

      - ${APSY_DATA}/logs:/logs

    environment:
      - TZ=America/Costa_Rica

volumes:

  mariadb_data: